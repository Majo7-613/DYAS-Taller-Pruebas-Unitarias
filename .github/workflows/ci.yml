name: CI - Pruebas Unitarias

# Integracion continua del taller: cada push y cada pull request ejecuta la
# suite completa, la puerta de cobertura de JaCoCo (>= 80%) y el analisis de
# mutacion de PIT (>= 60%). Si algo de eso falla, el build falla y el merge
# queda bloqueado.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Compilar, probar y medir calidad
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: registraduria

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Ejecuta las pruebas por ejemplo, las propiedades de jqwik, genera el
      # reporte de JaCoCo y aplica la puerta de cobertura del 80%.
      - name: Pruebas y cobertura (JaCoCo)
        run: mvn -B clean verify

      # Responde la pregunta que la cobertura no responde: si el codigo cambia,
      # se entera alguna prueba? Falla si el mutation score baja de 60.
      - name: Pruebas de mutacion (PIT)
        run: mvn -B test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-calidad
          path: |
            registraduria/target/site/jacoco/
            registraduria/target/pit-reports/
            registraduria/target/surefire-reports/
          if-no-files-found: warn
